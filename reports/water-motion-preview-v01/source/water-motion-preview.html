<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hooked — Willow Pond water motion preview</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #111; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; image-rendering: auto; }
</style>
<canvas id="view" width="720" height="1280"></canvas>
<script>
/*
 * Standalone cinematic preview.  This is intentionally not game code:
 * it lets us review restrained photoreal water motion before integrating it.
 * All movement is generated in the fragment shader and repeats every 6 seconds.
 */
const W = 720, H = 1280, PERIOD = 6;
const canvas = document.querySelector('#view');
const gl = canvas.getContext('webgl', { premultipliedAlpha: false, preserveDrawingBuffer: true });
if (!gl) throw new Error('WebGL is required for this preview');

const vertex = `
attribute vec2 p;
varying vec2 uv;
void main() { uv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }
`;
const fragment = `
precision highp float;
varying vec2 uv;
uniform sampler2D photo;
uniform sampler2D waterMask;
uniform float phase;

// A six-second periodic, multi-direction spectrum.  The displacement remains
// below ~2.5 source pixels at the viewer, and below a pixel in the distance.
float wave(vec2 p) {
  return sin(dot(p, vec2(18.7, 46.1)) + phase * 2.0) * .42
       + sin(dot(p, vec2(-31.4, 23.7)) - phase * 3.0 + .7) * .28
       + sin(dot(p, vec2(8.2, -68.3)) + phase * 5.0 + 1.8) * .18
       + sin(dot(p, vec2(52.6, 13.2)) - phase * 4.0 + 2.6) * .12;
}
vec2 displacement(vec2 p, float strength) {
  // Use two unaligned derivatives instead of uniform horizontal strips.
  float a = wave(p);
  float b = wave(p + vec2(.071, -.043));
  return vec2(a * .00175, b * .00130) * strength;
}
void main() {
  vec4 base = texture2D(photo, uv);
  vec4 maskTex = texture2D(waterMask, uv);
  // The hand-painted mask has feathered alpha around protected objects.  Use
  // it as well as luminance so a blurred transparent pixel does not animate.
  float mask = maskTex.r * maskTex.a;
  // Distance attenuates physically: the far bank barely moves.
  // UNPACK_FLIP_Y_WEBGL makes uv.y zero at the image's bottom; convert back
  // to top-down image space before applying the near-water perspective ramp.
  float imageY = 1.0 - uv.y;
  float perspective = mix(.23, 1., smoothstep(.39, .96, imageY));
  vec2 d = displacement(uv * vec2(1.0, 1.42), perspective);
  vec4 moved = texture2D(photo, clamp(uv + d, vec2(0.001), vec2(.999)));
  vec3 colour = mix(base.rgb, moved.rgb, mask);

  // Very occasional, local light lift on crests.  It is deliberately below
  // the threshold that reads as drawn foam or a filter over the photograph.
  float crest = smoothstep(.93, 1.0, .5 + .5 * wave(uv * vec2(1.0, 1.42) + vec2(.013, .021)));
  float glint = crest * mask * perspective * .025;
  colour = mix(colour, vec3(1.0), glint);
  gl_FragColor = vec4(colour, 1.0);
}
`;

function shader(type, source) {
  const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);
const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const p = gl.getAttribLocation(program, 'p'); gl.enableVertexAttribArray(p); gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 0, 0);

function texture(unit, image) {
  const t = gl.createTexture(); gl.activeTexture(unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
  return t;
}

// Hand-authored shoreline mask, based on the Willow screenshot.  It leaves
// the header, sky, trees, shore, rod, line, bobber, hand and reel untouched.
async function makeWaterMask() {
  const m = document.createElement('canvas'); m.width = W; m.height = H;
  const c = m.getContext('2d'); c.fillStyle = 'black'; c.fillRect(0, 0, W, H);
  c.save(); c.filter = 'blur(2.4px)'; c.fillStyle = 'white'; c.beginPath();
  c.moveTo(222, 571); c.bezierCurveTo(262, 535, 317, 513, 383, 509);
  c.bezierCurveTo(480, 503, 602, 506, 720, 531);
  c.lineTo(720, 1280); c.lineTo(316, 1280);
  c.bezierCurveTo(281, 1195, 273, 1068, 259, 946);
  c.bezierCurveTo(244, 824, 230, 691, 222, 571); c.closePath(); c.fill(); c.restore();
  // The immediate foreground contains reeds and bank detail. Fade motion out
  // before it rather than creating a broad visible protected halo around each reed.
  c.save(); c.globalCompositeOperation = 'destination-out';
  const foregroundFade = c.createLinearGradient(0, 1140, 0, 1210);
  foregroundFade.addColorStop(0, 'rgba(0,0,0,0)'); foregroundFade.addColorStop(1, 'rgba(0,0,0,1)');
  c.fillStyle = foregroundFade; c.fillRect(0, 1140, W, 140); c.restore();
  // Derive the exact rod/hand/reel silhouette from the production alpha art,
  // rather than approximating it with a broad frozen strip.
  const rod = await load('/rod-alpha.png');
  c.save(); c.globalCompositeOperation = 'destination-out'; c.filter = 'blur(3px)';
  c.drawImage(rod, -80, 434, 480, 852);
  c.strokeStyle = 'rgba(0,0,0,1)'; c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 8;
  c.beginPath(); c.moveTo(320.4, 455.4); c.quadraticCurveTo(415.7, 563.7, 511, 622); c.stroke();
  c.beginPath(); c.ellipse(511, 623, 18, 18, 0, 0, Math.PI * 2); c.fill();
  c.restore();
  // Opaque cores keep the actual thin mono and bobber pixels exactly stable;
  // the prior soft pass only supplies their two-pixel natural feather.
  c.save(); c.globalCompositeOperation = 'destination-out'; c.filter = 'none';
  c.strokeStyle = 'black'; c.lineCap = 'round'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(320.4, 455.4); c.quadraticCurveTo(415.7, 563.7, 511, 622); c.stroke();
  c.beginPath(); c.ellipse(511, 623, 12, 12, 0, 0, Math.PI * 2); c.fill(); c.restore();
  return m;
}

function load(src) { return new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = src; }); }
async function boot() {
  const photo = await load('./willow-line-out-720.png');
  const maskCanvas = await makeWaterMask();
  texture(gl.TEXTURE0, photo); texture(gl.TEXTURE1, maskCanvas);
  gl.uniform1i(gl.getUniformLocation(program, 'photo'), 0);
  gl.uniform1i(gl.getUniformLocation(program, 'waterMask'), 1);
  const phase = gl.getUniformLocation(program, 'phase');
  window.renderAt = (seconds) => { gl.uniform1f(phase, seconds / PERIOD * Math.PI * 2); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); };
  window.previewMeta = { width: W, height: H, period: PERIOD, source: 'willow-line-out-720.png' };
  window.getWaterMaskPng = () => maskCanvas.toDataURL('image/png');
  window.renderAt(0);
  window.previewReady = true;
  // Automated capture passes ?capture=1 and owns renderAt(), preventing
  // rAF from racing the deterministic frame clock used by the encoder.
  if (!new URLSearchParams(location.search).has('capture')) {
    let start = performance.now();
    function loop(now) { window.renderAt(((now - start) / 1000) % PERIOD); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  }
}
boot();
</script>
</html>
